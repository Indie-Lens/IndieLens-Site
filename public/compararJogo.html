
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>IndieLens - Protótipos</title>

    <link rel="stylesheet" href="css/CompararJogo.css">
</head>

<body>

    <header class="topbar">
        <span class="logo">IndieLens</span>
    </header>

    <div class="layout">

        <aside class="sidebar">

            <div class="sidebar-top">
                <div class="logo">
                    <span class="logo-icon">I</span>
                    <span>IndieLens</span>
                </div>
            </div>

            <nav class="menu">
                <a href="AnaliseJogo.html" class="menu-item">
                    Dashboard
                </a>

                <a href="#" class="menu-item">
                    Outro
                </a>

                <a href="prototipos.html" class="menu-item ativo">
                    Protótipos
                </a>
            </nav>

            <div class="sidebar-bottom">
                <div class="usuario">
                    <img class="avatar" src="" alt="Foto do usuário" id="avatar">
                    <span id="perfilNome">teste</span>
                </div>

                <button type="button" class="btn-sair" id="btnSair">
                    Sair
                </button>
            </div>

        </aside>

        <main class="conteudo">

            <div class="conteudo-topo">
                <h1>Protótipos</h1>

                <button class="btn-cadastrar" id="btnCadastrar" type="button">
                    Realizar comparação +
                </button>
            </div>

            <section class="grid" id="grid"></section>

            <p class="vazio" id="vazio">
                Nenhum protótipo cadastrado ainda.
            </p>

        </main>

    </div>

    <!-- MODAL DE CADASTRO -->

    <div class="modal" id="modal" hidden>

        <form class="modal-box" id="form">

            <h2 id="modalTitulo"> Jogo</h2>

            <label>
                Nome
                <input 
                    name="nome"
                    placeholder="Ex: Hollow Knight"
                    required>
            </label>

            <label>
                Preço
                <input
                    type="number"
                    name="preco"
                    placeholder="Ex: 49.90"
                    min="0"
                    step="0.01"
                    required
                >
            </label>

            <label>
                Data
                <input
                    type="date"
                    name="data"
                    required
                >
            </label>

            <label>
                Tag
                <input
                    type="text"
                    name="tag"
                    placeholder="Ex: Multiplayer, Indie, RPG"
                    required
                >
            </label>

            <label>
                Gênero
                <input
                    type="text"
                    name="genero"
                    placeholder="Ex: Aventura, Terror, RPG"
                    required
                >
            </label>

            <div class="modal-acoes">

                <button
                    type="button"
                    class="btn-cancelar"
                    id="btnCancelar"
                >
                    Cancelar
                </button>

                <button type="submit" class="btn-cadastrar">
                    Salvar
                </button>

            </div>

        </form>

    </div>

    
<!-- POPUP DE ANÁLISE DO PROTÓTIPO -->

<div class="modal-analise" id="modalAnalise" hidden>

    <div class="analise-box"
         role="dialog"
         aria-modal="true"
         aria-labelledby="analiseNome">

        <div class="analise-topo">

            <div class="analise-identificacao">

                <h2 id="analiseNome">Nome do jogo</h2>
            </div>

            <button
                type="button"
                class="analise-fechar"
                id="fecharAnalise"
                aria-label="Fechar análise">
                ×
            </button>

        </div>

        <!-- INFORMAÇÕES DO PROJETO -->

        <section class="analise-resumo">

            <div class="analise-dados">

                <span class="analise-subtitulo">
                    INFORMAÇÕES DO PROJETO
                </span>

                <div class="analise-info-grid">

                    <div class="analise-info">
                        <span>Preço</span>
                        <strong id="analisePreco">-</strong>
                    </div>

                    <div class="analise-info">
                        <span>Data</span>
                        <strong id="analiseData">-</strong>
                    </div>

                    <div class="analise-info">
                        <span>Tag</span>
                        <strong id="analiseTag">-</strong>
                    </div>

                    <div class="analise-info">
                        <span>Gênero</span>
                        <strong id="analiseGenero">-</strong>
                    </div>

                </div>

            </div>

        </section>

        <!-- JOGOS SEMELHANTES -->

        <section class="jogos-parecidos">

            <div class="parecidos-titulo">

                <div>
                    <h3>Jogos semelhantes</h3>
                    <p>Referências para o seu próximo projeto</p>
                </div>

                <span class="parecidos-contador" id="quantidadeJogos">
                    0 jogos
                </span>

            </div>

            <div class="parecidos-lista" id="listaJogosParecidos">
            </div>

        </section>

        <div class="analise-rodape">

           

            <button
                type="button"
                class="btn-cadastrar"
                id="fecharAnaliseRodape">
                Fechar análise
            </button>

        </div>

    </div>

</div>


    <script src="js/dashDesenvolvedor.js"></script>

</body>
</html>
