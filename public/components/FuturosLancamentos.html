<section class="futuros-lancamentos" aria-labelledby="tituloFuturosLancamentos">
    <header class="fl-cabecalho">
        <div>
            <h2 id="tituloFuturosLancamentos">Futuros Lançamentos</h2>
            <p>Veja o calendário dos futuros lançamentos da Steam</p>
        </div>
    </header>
    <div class="fl-painel">
        <section class="fl-calendario" aria-label="Calendário de lançamentos">
            <div class="fl-controle-mes">
                <button
                    class="fl-seta fl-mes-anterior"
                    type="button"
                    aria-label="Mês anterior"
                >
                    &#8249;
                </button>
                <h3 class="fl-mes-atual">Setembro 2026</h3>
                <button
                    class="fl-seta fl-proximo-mes"
                    type="button"
                    aria-label="Próximo mês"
                >
                    &#8250;
                </button>
            </div>
            <div class="fl-dias-semana" aria-hidden="true">
                <span>D</span><span>S</span><span>T</span><span>Q</span
                ><span>Q</span><span>S</span><span>S</span>
            </div>
            <div class="fl-dias" role="grid" aria-label="Dias do mês"></div>
        </section>
        <aside class="fl-lista" aria-label="Lançamentos do mês">
            <h3>Lançamentos de <span class="fl-mes-lista">SETEMBRO</span></h3>
            <div class="fl-itens">
                <article class="fl-jogo">
                    <div class="fl-data">
                        <span>DIA</span><strong>1</strong>
                    </div>
                    <div class="fl-nome-jogo">Stardew Valley</div>
                    <div
                        class="fl-capa fl-capa-stardew"
                        role="img"
                        aria-label="Capa ilustrativa de Stardew Valley"
                    >
                        <span>STARDEW<br />VALLEY</span>
                    </div>
                </article>
                <article class="fl-jogo">
                    <div class="fl-data">
                        <span>DIA</span><strong>10</strong>
                    </div>
                    <div class="fl-nome-jogo">Yakuza Kiwami II</div>
                    <div
                        class="fl-capa fl-capa-yakuza"
                        role="img"
                        aria-label="Capa ilustrativa de Yakuza Kiwami II"
                    >
                        <span>龍が如く</span>
                    </div>
                </article>
                <article class="fl-jogo">
                    <div class="fl-data">
                        <span>DIA</span><strong>21</strong>
                    </div>
                    <div class="fl-nome-jogo">Hollow Knight</div>
                    <div
                        class="fl-capa fl-capa-hollow"
                        role="img"
                        aria-label="Capa ilustrativa de Hollow Knight"
                    >
                        <span>HOLLOW<br />KNIGHT</span>
                    </div>
                </article>
            </div>
        </aside>
    </div>
</section>
