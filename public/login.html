<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="js/login.js"></script>
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">

        <a href="index.html" class="botao-saida"><i class="fa-solid fa-right-from-bracket"></i></a>

        <div class="card-cadastro">

            <div class="titulo">
                <h1>LOGIN</h1>
            </div>

            <div class="formulario">

                <div class="campo">
                    <input id="email_input" type="text" placeholder="Email">
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div class="campo">
                    <input id="senha_input" type="password" placeholder="Senha">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <button class="botao" onclick="entrar()">ENTRAR</button>

            </div>
            <div class="cadastro-link">
                <p>Não tem conta? <a href="cadastro.html">Faça cadastro</a></p>
            </div>

        </div>

        <div class="imagem">
            <img src="assets/imgs/tela.jpg" alt="Imagem">

        </div>

    </div>
</body>
</html>
