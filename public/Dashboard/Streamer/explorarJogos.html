<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Jogos | INDIE LENS</title>
    <link rel="stylesheet" href="../../components/sidebar.css">
    <link rel="stylesheet" href="./CSS/explorarJogos.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">

        <aside class="sidebar" id="sidebar"></aside>

        <main class="conteudo-principal">
            <div class="painel-geral">

                <div class="cabecalho-pagina">
                    <div>
                        <h1>Explorar Jogos</h1>
                        <p>Descubra jogos indie com potencial para suas transmissões.</p>
                    </div>
                    <div class="acoes-usuario">
                        <button class="btn-notificacao" aria-label="Notificações" onclick="abrirNotificacoes()">
                            <i class="fa-regular fa-bell"></i>
                        </button>
                        <div class="perfil">
                            <img src="https://marketplace.canva.com/Dz63E/MAF4KJDz63E/1/tl/canva-%C3%ADcone-do-usu%C3%A1rio-MAF4KJDz63E.png" alt="Avatar" class="avatar">
                            <span class="nome">Usuário</span>
                        </div>
                    </div>
                </div>

                <div class="cartao">
                    <div class="filtros-wrapper">
                        <div class="barra-busca">
                            <div class="input-grupo">
                                <i class="fa-solid fa-magnifying-glass" style="font-size:12px;"></i>
                                <input type="text" id="campoBusca" placeholder="Buscar por nome, gênero ou desenvolvedor...">
                            </div>
                            <div class="select-grupo">
                                <select id="filtroOrdem">
                                    <option value="viewers">Maior avg. viewers</option>
                                    <option value="avaliacao">Melhor avaliados</option>
                                    <option value="recentes">Lançamentos recentes</option>
                                    <option value="horas">Mais horas jogadas</option>
                                </select>
                            </div>
                            <div class="select-grupo">
                                <select id="filtroPlataforma">
                                    <option value="">Todas as plataformas</option>
                                    <option value="windows">Windows</option>
                                    <option value="mac">macOS</option>
                                    <option value="linux">Linux</option>
                                </select>
                            </div>
                        </div>
                        <div class="chips-genero">
                            <span>Gênero:</span>
                            <button class="chip ativo" data-genero="todos">Todos</button>
                            <button class="chip" data-genero="RPG">RPG</button>
                            <button class="chip" data-genero="Roguelike">Roguelike</button>
                            <button class="chip" data-genero="Aventura">Aventura</button>
                            <button class="chip" data-genero="Simulação">Simulação</button>
                            <button class="chip" data-genero="Plataforma">Plataforma</button>
                            <button class="chip" data-genero="Ação">Ação</button>
                        </div>
                    </div>
                </div>

                <div class="grid-jogos" id="gridJogos"></div>

                <div id="statusJogos" class="estado-jogos" aria-live="polite"></div>

                <div id="rodapePaginacao" class="rodape-paginacao">
                    <button type="button" id="btnCarregarMais" class="btn-carregar-mais" style="display: none;">
                        Carregar mais jogos
                    </button>
                    <div id="sentinelaCarregamento" class="sentinela-carregamento" aria-hidden="true"></div>
                </div>

            </div>
        </main>
    </div>

    <script>
        (function () {
            const LIMITE_INICIAL = 20;
            const LIMITE_PAGINA = 12;
            const IMAGEM_FALLBACK = "../../assets/imgs/Logo.jpeg";
            const API_BASE = window.location.protocol === "file:" ? "http://localhost:3333" : "";

            const MAPA_SLUGS_PAG_JOGO = {
                "hades": "hades",
                "stardew valley": "stardew",
                "hollow knight": "hollow",
                "hollow knight: silksong": "hollow",
                "cuphead": "cuphead",
                "dave the diver": "dave",
                "celeste": "celeste",
                "undertale": "undertale",
                "dead cells": "deadcells"
            };

            const gridJogos = document.getElementById("gridJogos");
            const statusJogos = document.getElementById("statusJogos");
            const btnCarregarMais = document.getElementById("btnCarregarMais");
            const sentinela = document.getElementById("sentinelaCarregamento");
            const campoBusca = document.getElementById("campoBusca");
            const filtroOrdem = document.getElementById("filtroOrdem");
            const filtroPlataforma = document.getElementById("filtroPlataforma");
            const chips = document.querySelectorAll(".chip");
            const conteudoPrincipal = document.querySelector(".conteudo-principal");

            let generoAtivo = "todos";
            let offsetAtual = 0;
            let carregando = false;
            let temMais = true;
            let requisicaoId = 0;
            let timerBusca = null;

            function escaparHtml(texto) {
                return String(texto == null ? "" : texto)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function resolverImagem(url) {
                if (typeof url !== "string") return IMAGEM_FALLBACK;
                const limpa = url.trim();
                if (!limpa) return IMAGEM_FALLBACK;

                const lower = limpa.toLowerCase();
                if (lower.startsWith("javascript:") || lower.startsWith("vbscript:") || lower.startsWith("data:")) {
                    return IMAGEM_FALLBACK;
                }

                if (lower.startsWith("https://") || lower.startsWith("http://") || limpa.startsWith("../../") || limpa.startsWith("/") || limpa.startsWith("./")) {
                    return limpa;
                }

                return IMAGEM_FALLBACK;
            }

            function gerarSlug(nome) {
                const texto = String(nome || "").trim();
                const chave = texto.toLowerCase();
                if (MAPA_SLUGS_PAG_JOGO[chave]) {
                    return MAPA_SLUGS_PAG_JOGO[chave];
                }
                const prefixo = chave.split(":")[0].trim();
                if (MAPA_SLUGS_PAG_JOGO[prefixo]) {
                    return MAPA_SLUGS_PAG_JOGO[prefixo];
                }
                const slug = chave
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^a-z0-9]+/g, "-")
                    .replace(/^-+|-+$/g, "");
                return slug || "jogo";
            }

            function formatarCompacto(valor) {
                const numero = Number(valor) || 0;
                if (numero >= 1000) {
                    return (numero / 1000).toFixed(1).replace(/\.0$/, "") + "k";
                }
                return Math.round(numero).toString();
            }

            function primeiroGenero(generos) {
                if (!generos) return "Indie";
                const primeiro = String(generos).split(",")[0].trim();
                return primeiro || "Indie";
            }

            function criarCardHtml(jogo) {
                const nome = escaparHtml(jogo.nome || "Jogo sem título");
                const generoPrincipal = escaparHtml(primeiroGenero(jogo.generos));
                const descricao = escaparHtml(jogo.descricao || "Sem descrição disponível.");
                const imagemSegura = escaparHtml(resolverImagem(jogo.imagem));
                const avaliacao = Math.round(Number(jogo.avaliacaoPct) || 0) + "%";
                const avgViewers = formatarCompacto(jogo.avgViewers);
                const horasMedianas = Math.round(Number(jogo.horasMedianas) || 0) + "h";
                const ccuMedio = formatarCompacto(jogo.ccuMedio);
                const emAltaHtml = Number(jogo.emAlta) === 1 ? '<span class="badge-alta">↑ Em alta</span>' : "";
                const slug = gerarSlug(jogo.nome);
                const href = "pagJogo.html?id=" + encodeURIComponent(jogo.idJogo) + "&jogo=" + encodeURIComponent(slug);

                return (
                    '<a class="card-jogo" href="' + href + '" data-genero="' + generoPrincipal + '">' +
                        '<div class="card-capa">' +
                            '<img src="' + imagemSegura + '" alt="' + nome + '" loading="lazy" onerror="this.onerror=null;this.src=\'' + IMAGEM_FALLBACK + '\';">' +
                            '<span class="badge-genero">' + generoPrincipal + '</span>' +
                            emAltaHtml +
                        '</div>' +
                        '<div class="card-corpo">' +
                            '<div class="card-topo-info">' +
                                '<h3>' + nome + '</h3>' +
                                '<span class="card-avaliacao">' + avaliacao + '</span>' +
                            '</div>' +
                            '<p class="card-desc">' + descricao + '</p>' +
                        '</div>' +
                        '<div class="card-metricas">' +
                            '<div class="card-stat">' +
                                '<span class="card-stat-label">Avg. viewers</span>' +
                                '<span class="card-stat-valor verde">' + avgViewers + '</span>' +
                            '</div>' +
                            '<div class="card-stat">' +
                                '<span class="card-stat-label">Horas median.</span>' +
                                '<span class="card-stat-valor">' + horasMedianas + '</span>' +
                            '</div>' +
                            '<div class="card-stat">' +
                                '<span class="card-stat-label">CCU médio</span>' +
                                '<span class="card-stat-valor roxo">' + ccuMedio + '</span>' +
                            '</div>' +
                        '</div>' +
                    '</a>'
                );
            }

            function atualizarStatus(mensagem, tipo) {
                if (!mensagem) {
                    statusJogos.textContent = "";
                    statusJogos.className = "estado-jogos";
                    return;
                }
                statusJogos.textContent = mensagem;
                statusJogos.className = "estado-jogos " + (tipo || "");
            }

            function atualizarBotaoCarregarMais() {
                btnCarregarMais.style.display = temMais && !carregando ? "inline-flex" : "none";
            }

            async function carregarJogos(reiniciar) {
                if (reiniciar) {
                    offsetAtual = 0;
                    temMais = true;
                    gridJogos.innerHTML = "";
                } else if (carregando || !temMais) {
                    return;
                }

                const limit = reiniciar ? LIMITE_INICIAL : LIMITE_PAGINA;
                const reqAtual = ++requisicaoId;
                carregando = true;
                atualizarBotaoCarregarMais();
                atualizarStatus("Carregando jogos...", "carregando");

                const params = new URLSearchParams({
                    limit: String(limit),
                    offset: String(offsetAtual),
                    ordem: filtroOrdem.value || "viewers"
                });

                const busca = campoBusca.value.trim();
                if (busca) params.set("busca", busca);
                if (generoAtivo && generoAtivo !== "todos") params.set("genero", generoAtivo);
                if (filtroPlataforma.value) params.set("plataforma", filtroPlataforma.value);

                try {
                    const resposta = await fetch(API_BASE + "/jogos?" + params.toString());
                    if (!resposta.ok) {
                        throw new Error("Erro HTTP " + resposta.status);
                    }
                    const dados = await resposta.json();
                    if (reqAtual !== requisicaoId) return;

                    const jogos = Array.isArray(dados.jogos) ? dados.jogos : [];
                    if (jogos.length > 0) {
                        gridJogos.insertAdjacentHTML("beforeend", jogos.map(criarCardHtml).join(""));
                        offsetAtual += jogos.length;
                    }

                    temMais = Boolean(dados.temMais);

                    if (offsetAtual === 0) {
                        atualizarStatus("Nenhum jogo encontrado para os filtros selecionados.", "vazio");
                    } else {
                        atualizarStatus("", "");
                    }
                } catch (erro) {
                    if (reqAtual !== requisicaoId) return;
                    console.error("Erro ao carregar jogos:", erro);
                    if (offsetAtual === 0) {
                        atualizarStatus("Não foi possível carregar os jogos no momento.", "erro");
                    } else {
                        atualizarStatus("Erro ao carregar mais jogos.", "erro");
                    }
                } finally {
                    if (reqAtual === requisicaoId) {
                        carregando = false;
                        atualizarBotaoCarregarMais();
                    }
                }
            }

            chips.forEach(function (chip) {
                chip.addEventListener("click", function () {
                    chips.forEach(function (c) { c.classList.remove("ativo"); });
                    chip.classList.add("ativo");
                    generoAtivo = chip.dataset.genero || "todos";
                    carregarJogos(true);
                });
            });

            campoBusca.addEventListener("input", function () {
                clearTimeout(timerBusca);
                timerBusca = setTimeout(function () {
                    carregarJogos(true);
                }, 300);
            });

            filtroOrdem.addEventListener("change", function () {
                carregarJogos(true);
            });

            filtroPlataforma.addEventListener("change", function () {
                carregarJogos(true);
            });

            btnCarregarMais.addEventListener("click", function () {
                carregarJogos(false);
            });

            if ("IntersectionObserver" in window && sentinela) {
                const observer = new IntersectionObserver(function (entries) {
                    if (entries.some(function (entry) { return entry.isIntersecting; })) {
                        if (temMais && !carregando && offsetAtual > 0) {
                            carregarJogos(false);
                        }
                    }
                }, { rootMargin: "200px" });
                observer.observe(sentinela);
            }

            function verificarScrollFallback() {
                if (carregando || !temMais || offsetAtual === 0) return;
                const pertoDoFimJanela = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 220;
                const pertoDoFimContainer = conteudoPrincipal
                    ? conteudoPrincipal.scrollTop + conteudoPrincipal.clientHeight >= conteudoPrincipal.scrollHeight - 220
                    : false;
                if (pertoDoFimJanela || pertoDoFimContainer) {
                    carregarJogos(false);
                }
            }

            window.addEventListener("scroll", verificarScrollFallback, { passive: true });
            if (conteudoPrincipal) {
                conteudoPrincipal.addEventListener("scroll", verificarScrollFallback, { passive: true });
            }

            carregarJogos(true);
        })();
    </script>

    <script>
        fetch("./sidebarStreamer.html")
            .then(res => {
                if (!res.ok) throw new Error("Não foi possível carregar o componente");
                return res.text();
            })
            .then(data => { document.getElementById("sidebar").innerHTML = data; })
            .catch(erro => console.log(erro));
    </script>
    <script src="./JS/global.js"></script>
</body>

<script>
    function abrirMenuMobile() {
    const sidebar = document.querySelector("#sidebar .left-container");
    const fundo = document.querySelector("#sidebar .fundo-menu");

    sidebar?.classList.add("menu-aberto");
    fundo?.classList.add("menu-aberto");
}

function fecharMenuMobile() {
    const sidebar = document.querySelector("#sidebar .left-container");
    const fundo = document.querySelector("#sidebar .fundo-menu");

    sidebar?.classList.remove("menu-aberto");
    fundo?.classList.remove("menu-aberto");

}
</script>
</html>
