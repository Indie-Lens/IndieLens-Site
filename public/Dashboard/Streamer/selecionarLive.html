<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Histórico de Lives | INDIE LENS</title>
        <link rel="stylesheet" href="../../components/sidebar.css" />
        <link rel="stylesheet" href="./CSS/SelecionarLives.css" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    </head>
    <body>
        <div class="container">

        <aside class="sidebar" id="sidebar"></aside>

        <main class="conteudo-principal">
            <header class="cabecalho">
                <div class="titulo-sessao">
                    <div>
                        <h1>Histórico de Lives</h1>
                        <p>Acompanhe todas as suas transmissões e veja o desempenho de cada uma.</p>
                    </div>
                </div>

                <div class="acoes-usuario">
                    <button class="btn-notificacao" type="button" aria-label="Notificações" onclick="abrirNotificacoes()">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <div class="perfil">
                        <img src="https://marketplace.canva.com/Dz63E/MAF4KJDz63E/1/tl/canva-%C3%ADcone-do-usu%C3%A1rio-MAF4KJDz63E.png" alt="Avatar do Streamer" class="avatar" />
                        <div class="info-perfil">
                            <span class="nome">Usuário</span>
                        </div>
                    </div>
                </div>
            </header>

            <section class="barra-filtros">
                <div class="input-grupo">
                    <input type="text" id="busca" placeholder="Buscar por jogo, categoria ou título da live..." />
                </div>

                <div class="filtros-selecao">
                    <div class="select-grupo">
                        <select id="filtroJogo">
                            <option value="">Todos os jogos</option>
                        </select>
                    </div>

                    <div class="select-grupo">
                        <select id="filtroCategoria">
                            <option value="">Todas as categorias</option>
                        </select>
                    </div>

                    <div class="select-grupo">
                        <select id="ordenacao">
                            <option value="recentes">Mais recentes</option>
                            <option value="antigas">Mais antigas</option>
                            <option value="audiencia">Maior audiência</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="grid-lives" id="gridLives"></section>

            <button class="btn-adicionar-live" id="abrirCadastro">
                <i class="fa-solid fa-plus"></i>
                Adicionar Live
            </button>

            <div class="modal-overlay" id="modalCadastro">
                <div class="modal-container">
                    <button class="fechar-modal" id="fecharCadastro" aria-label="Fechar cadastro">
                        &times;
                    </button>
                    <iframe src="./CadastrarLive.html" title="Cadastrar nova live"></iframe>
                </div>
            </div>
        </main>
        </div>

<script>
    const modal  = document.getElementById("modalCadastro");
    const abrir  = document.getElementById("abrirCadastro");
    const fechar = document.getElementById("fecharCadastro");

    abrir.addEventListener("click", () => modal.classList.add("ativo"));
    fechar.addEventListener("click", () => modal.classList.remove("ativo"));
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("ativo"); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") modal.classList.remove("ativo"); });
</script>

<script src="./JS/lives.js"></script>
<script>
    let todasAsLives = [];
    const grid = document.getElementById("gridLives");
    const esc = LivesFmt.esc;

    function mensagemGrid(texto) {
        grid.innerHTML = `<p style="color:#8c8d9e;grid-column:1/-1;">${esc(texto)}</p>`;
    }

    function cardLive(l) {
        const detalhes = `${LivesFmt.data(l.dataLive)} • ${LivesFmt.hora(l.horaInicio)} - ${LivesFmt.hora(l.horaTermino)}`;
        return `
        <a href="./dashboardLive.html?id=${encodeURIComponent(l.idLive)}">
            <article class="card-live">
                <div class="card-header">
                    <div class="thumb-container">
                        <img src="${LivesFmt.imagemJogo(l.nomeJogo)}" alt="${esc(l.nomeJogo)}" />
                    </div>
                    <div class="info-principal">
                        <div class="topo-info">
                            <h3>${esc(l.nomeJogo)}</h3>
                            <button class="btn-opcoes"></button>
                        </div>
                        <span class="categoria">${esc(l.categoria)}</span>
                        <p class="descricao-live">${esc(l.tituloLive)}</p>
                    </div>
                </div>
                <div class="card-detalhes">
                    <span class="detalhe-item"><i class="fa-regular fa-calendar"></i> ${detalhes}</span>
                    <span class="detalhe-item"><i class="fa-regular fa-clock"></i> ${esc(LivesFmt.duracao(l.duracao))}</span>
                </div>
                <div class="card-metricas">
                    <div class="metrica">
                        <span class="metrica-header">Espectadores Médios</span>
                        <span class="valor">${LivesFmt.numero(l.mediaEspectadores)}</span>
                    </div>
                    <div class="metrica">
                        <span class="metrica-header">Pico de Viewers</span>
                        <span class="valor">${LivesFmt.numero(l.picoEspectadores)}</span>
                    </div>
                    <div class="metrica">
                        <span class="metrica-header">Visualizações</span>
                        <span class="valor">${LivesFmt.numero(l.visualizacoesTotais)}</span>
                    </div>
                </div>
                <div class="card-tags">
                    <span class="tag">${esc(l.categoria)}</span>
                </div>
            </article>
        </a>`;
    }

    function preencherFiltros() {
        const jogoAtual = document.getElementById("filtroJogo").value;
        const catAtual = document.getElementById("filtroCategoria").value;
        const unicos = campo => [...new Set(todasAsLives.map(l => l[campo]))].sort((a, b) => a.localeCompare(b, "pt-BR"));

        document.getElementById("filtroJogo").innerHTML =
            '<option value="">Todos os jogos</option>' +
            unicos("nomeJogo").map(j => `<option value="${esc(j)}">${esc(j)}</option>`).join("");
        document.getElementById("filtroCategoria").innerHTML =
            '<option value="">Todas as categorias</option>' +
            unicos("categoria").map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");

        document.getElementById("filtroJogo").value = jogoAtual;
        document.getElementById("filtroCategoria").value = catAtual;
    }

    function renderizar() {
        const termo = document.getElementById("busca").value.trim().toLowerCase();
        const jogo = document.getElementById("filtroJogo").value;
        const categoria = document.getElementById("filtroCategoria").value;
        const ordem = document.getElementById("ordenacao").value;

        let lista = todasAsLives.filter(l =>
            (!jogo || l.nomeJogo === jogo) &&
            (!categoria || l.categoria === categoria) &&
            (!termo || [l.nomeJogo, l.categoria, l.tituloLive].join(" ").toLowerCase().includes(termo))
        );

        const chave = l => l.dataLive + " " + l.horaInicio;
        if (ordem === "antigas") lista.sort((a, b) => chave(a).localeCompare(chave(b)));
        else if (ordem === "audiencia") lista.sort((a, b) => b.mediaEspectadores - a.mediaEspectadores);
        else lista.sort((a, b) => chave(b).localeCompare(chave(a)));

        if (!todasAsLives.length) return mensagemGrid("Você ainda não cadastrou nenhuma live. Clique em \"Adicionar Live\" para começar.");
        if (!lista.length) return mensagemGrid("Nenhuma live encontrada com esses filtros.");
        grid.innerHTML = lista.map(cardLive).join("");
    }

    async function carregarLives() {
        try {
            todasAsLives = await LivesAPI.listar();
            preencherFiltros();
            renderizar();
        } catch (erro) {
            mensagemGrid(erro.message);
        }
    }

    ["busca", "filtroJogo", "filtroCategoria", "ordenacao"].forEach(id => {
        document.getElementById(id).addEventListener(id === "busca" ? "input" : "change", renderizar);
    });

    // o formulário (iframe) avisa quando uma live foi salva
    window.addEventListener("message", (e) => {
        if (e.origin !== window.location.origin || !e.data || e.data.tipo !== "live-cadastrada") return;
        modal.classList.remove("ativo");
        document.querySelector("#modalCadastro iframe").src = "./CadastrarLive.html"; // formulário limpo
        carregarLives();
    });

    carregarLives();
</script>

<script>
    fetch("./sidebarStreamer.html")
        .then((res) => {
            if (!res.ok) throw new Error("Não foi possível carregar o componente");
            return res.text();
        })
        .then((data) => { document.getElementById("sidebar").innerHTML = data; })
        .catch((erro) => console.log(erro));
</script>

<script>
    function abrirMenuMobile() {
    const sidebar = document.querySelector("#sidebar .left-container");
    const fundo = document.querySelector("#sidebar .fundo-menu");

    sidebar?.classList.add("menu-aberto");
    fundo?.classList.add("menu-aberto");
}

function fecharMenuMobile() {
    const sidebar = document.querySelector("#sidebar .left-container");
    const fundo = document.querySelector("#sidebar .fundo-menu");

    sidebar?.classList.remove("menu-aberto");
    fundo?.classList.remove("menu-aberto");
}
</script>

<script src="./JS/global.js"></script>
</html>
